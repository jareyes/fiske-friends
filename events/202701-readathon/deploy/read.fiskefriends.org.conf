# nginx site for the read-a-thon preview.
# Only the read-a-thon and its styles and scripts are passed through;
# everything else on this subdomain goes to /readathon.
#
# Install:
#   sudo cp read.fiskefriends.org.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/read.fiskefriends.org.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d read.fiskefriends.org      (adds HTTPS and the http->https redirect)

server {
    listen 80;
    listen [::]:80;
    server_name read.fiskefriends.org;

    location = / {
        return 302 /readathon;
    }

    location ~ ^/(readathon|css|js)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Invite and cheer links are built from this, so they come out as https://read.fiskefriends.org/...
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        return 302 /readathon;
    }
}
